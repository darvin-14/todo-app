<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

    <h1>My Tasks</h1>

            id="taskInput"

        <button id="addButton">

        </button>

    </div>

    <ul id="taskList">

    </ul>

</div>

<script src="script.js"></script>

</body>

</html>
